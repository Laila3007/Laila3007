name: Atualizar Perfil README

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Laila3007
          outputs: |
            dist/snake.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Ricky-11/github-readme-stats-action@v1.0.2
        with:
          username: Laila3007
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: stats-output
          file_name: stats.svg
          options: "hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false"

  languages:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Ricky-11/github-readme-stats-action@v1.0.2
        with:
          username: Laila3007
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: languages-output
          file_name: languages.svg
          card_type: top-langs
          options: "locale=en&hide_title=false&layout=compact&card_width=320&langs_count=5&theme=dracula&hide_border=false"
